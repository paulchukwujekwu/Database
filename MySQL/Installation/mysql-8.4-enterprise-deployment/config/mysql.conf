############################################################
# MySQL Runtime Directory Configuration
# systemd tmpfiles
############################################################

# Purpose:
# Automatically recreate the MySQL runtime directory
# after server startup.
#
# Runtime directories under /run are temporary and are
# cleared during system reboot.
#
# This configuration ensures that:
# - /run/mysql exists after reboot
# - Ownership is assigned to mysql:mysql
# - Correct permissions are applied
# - MySQL service starts successfully

############################################################
# TYPE PATH        MODE UID   GID   AGE ARGUMENT
############################################################

d /run/mysql 0755 mysql mysql -







#
# Apply configuration:
#
# systemd-tmpfiles --create
#
# Verification:
#
# ls -ld /run/mysql
#
# Expected:
#
# drwxr-xr-x mysql mysql
#
